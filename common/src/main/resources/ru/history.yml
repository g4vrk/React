history:

  inference:

    format:

      print-entries: 18

      header:
        - " &fИстория ИИ {player} "

      empty:
        - "История пуста"

      entry-format:
        - "&fПроцент читерства: {probability} &7| &fУверенность AI: {confidence}"

      footer:
        - " &fИИ может ошибаться "

    entries:
      max: 100
