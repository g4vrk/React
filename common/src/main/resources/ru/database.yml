# После изменения настроек базы данных перезапустите плагин/сервер.
# Включает постоянное хранение данных игроков.
enabled: true

# Доступные типы: sqlite, h2, mysql, mongodb.
type: sqlite

history:
  # У истории inference нет лимита записей. Удаляются только записи старше этого времени.
  # Доступные единицы: ms, s, m, h, d.
  retention: 30d

  # Как часто удалять устаревшие inference-записи из базы данных.
  cleanup-interval: 1h

async:
  # Количество потоков для блокирующих операций с базой данных.
  executor-threads: 2

  # Максимальное количество задач БД, ожидающих свободный поток executor.
  executor-queue-capacity: 256

  # Размер временного fail-open буфера на случай недоступности базы данных.
  # Это не лимит истории, а только очередь ещё не сохранённых изменений.
  pending-write-capacity: 8192

  # Максимальное количество изменений VL/истории в одной транзакции или bulk-запросе.
  batch-size: 128

  # Задержка между попытками записи накопленных изменений.
  flush-interval: 250ms

  # Максимальное время на сохранение данных при выключении плагина.
  shutdown-timeout: 10s

  retry:
    # Начальная задержка переподключения после ошибки базы данных.
    initial-delay: 1s

    # Максимальная задержка переподключения.
    maximum-delay: 1m

    # Множитель экспоненциального увеличения задержки.
    multiplier: 2.0
