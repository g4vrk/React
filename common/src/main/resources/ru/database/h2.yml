# Имя файла H2. H2 добавит суффикс .mv.db и сохранит файл в plugins/React/.data/h2/.
file: react.db

username: sa
password: ""

# Рекомендуется REGULAR. Другие режимы H2 нужны только для совместимости.
compatibility-mode: REGULAR

# Разрешает нескольким JVM открывать один локальный файл. Для обычного сервера оставьте false.
auto-server: false

pool:
  maximum-pool-size: 4
  minimum-idle: 1
  connection-timeout: 10s
  validation-timeout: 5s
  idle-timeout: 10m
  max-lifetime: 30m
