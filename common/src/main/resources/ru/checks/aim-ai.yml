# Настройки буфера
buffer:

  # Сколько сохранять и отправлять поворотов для анализа?
  # Если используете нашу модель, оставляйте 40
  size: 40

  # С каким шагом отправлять данные на сервер?
  # Или же раз в сколько поворотов отправлять последние записанные?
  # Если используете нашу модель, оставляйте 10
  send-step: 10

# С какого процента читерства игрок считается нарушителем
alert:
  threshold: 0.45

# На сколько уменьшать VL, если игрок не читерит (После указанного количества поворотов)
decay:
  amount: 0.25