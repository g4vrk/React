# Сколько нужно поворотов, для того чтобы отправить их на анализ.
# Если используете модель от React, то ставьте не менее 40
required-samples: 150

# С какого процента читерства игрок считается нарушителем
alert:
  threshold: 0.45

# На сколько уменьшать VL, если игрок не читерит (После указанного количества поворотов)
decay:
  amount: 0.25