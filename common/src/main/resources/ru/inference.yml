
#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#
# Купить доступ к нашей модели -> https://www.react-ac.space/
#

# Включить ИИ сервер?
enabled: true

# Авторизация через токен
auth:

  # Если вы используете наш сайт (https://www.react-ac.space/), то
  # сюда нужно вставить token нужного сервера
  value: ВСТАВЬТЕ_ВАШ_КЛЮЧ

  # Включена ли отправка токена через что либо
  enabled: true

  # Настройки для кастомных ИИ моделей, для нашей модели не изменяйте
  type: body # none / bearer / header / query / body

  header:
    name: X-Subscription-Token

  query:
    parameter: token

  body:
    field: token


# Настройки ИИ сервера
inference:

  # Endpoint для подключений из плагина
  endpoint:

    base-url: 'https://api.react-ac.space'

    path: '/api/v2/inference/'
    # Сервер определяет модель по токену подписки.

  # Нужно только для своих кастомных моделей
  request:

    player-name-field: name
    rotations-field: frames

  response:

    probability-field: cheat_probability

# Настройки HTTP-клиента JDK
client:

  # Максимальное время на установление соединения.
  connect-timeout: 10s

  # Максимальное время полного запроса, включая получение тела ответа.
  call-timeout: 10s
