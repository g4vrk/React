
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#
# Purchase access to our model -> https://www.react-ac.space/
#

# Enable the AI server?
enabled: true

# AI server settings
inference:

  # Inference endpoint used by the plugin.
  endpoint:

    base-url: 'https://api.react-ac.space'

    path: '/api/v2/inference/'
    model-family: 'flower'
    model-name: 'baseline'

  # Only required for custom models
  request:

    player-name-field: name
    rotations-field: frames

  response:

    probability-field: cheat_probability

# Token authentication
auth:

  # Whether token authentication is enabled
  enabled: true

  # Single authentication value used by the selected auth type.
  value: YOUR_TOKEN

  # Authentication method for custom AI models; do not change this when using our model
  type: body # none / bearer / header / query / body

  header:
    name: X-Subscription-Token

  query:
    parameter: token

  body:
    field: token

# HTTP client settings
client:

  connect-timeout: 10s

  read-timeout: 10s

  write-timeout: 10s

  call-timeout: 10s

  retry-on-failure: true

  connection-pool:

    max-idle-connections: 5

    keep-alive-duration: 5m
