# Number of rotations required before sending them for analysis.
# If you use the React model, set this to at least 40.
required-samples: 150

# Probability threshold above which a player is considered to be cheating
alert:
  threshold: 0.45

# Amount by which VL is reduced when the player is legitimate (after the configured number of rotations)
decay:
  amount: 0.25
