punishments:
  aim:

    # Checks to which this punishment applies
    checks:
      - "aim-ai"

    # Actions performed when the player reaches a specific VL
    actions:

      # Runs at 10 VL, then repeats every 8 VL
      10;8:

        # Execute a command as the console
        - "[console] kick {player} [React] Heuristic violations (Aim-AI)"

        # Reset the player's VL
        #- "[reset-vl]"

