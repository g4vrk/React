punishments:
  aim:

    # Проверки, к которым применяется наказание
    checks:
      - "aim-ai"

    # Действия при достижении определённого VL
    actions:

      # Сработает после 25 VL, затем будет повторяться каждые 50 VL
      10;8:

        # Выполнить команду от имени консоли
        - "[console] kick {player} [React] Heuristic violations (Aim-AI)"

        # Сбросить VL игрока
        #- "[reset-vl]"

