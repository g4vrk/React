# SQLite file name. The file is stored in plugins/React/.data/sqlite/.
file: react.db

pool:
  # SQLite should normally use a single connection because it has one writer at a time.
  maximum-pool-size: 1
  minimum-idle: 1
  connection-timeout: 10s
  validation-timeout: 5s
  idle-timeout: 10m
  max-lifetime: 30m

pragmas:
  # WAL gives much better concurrent read/write behavior.
  journal-mode: WAL

  # NORMAL is a safe performance-oriented setting when WAL is enabled.
  synchronous: NORMAL

  # How long SQLite waits for a locked database before failing a query.
  busy-timeout-millis: 5000

  foreign-keys: true

  # Negative values configure the cache in KiB. -20000 is approximately 20 MiB.
  cache-size: -20000
