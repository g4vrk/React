# noinspection YAMLSchemaValidation
name: React
description: 'An AI powered Anti-Cheat product, ready for advanced use, product for www.react-ac.space'
version: ${version}

# noinspection PluginYml,YAMLSchemaValidation
main: ${mainClass}
api-version: '1.16'

folia-supported: true

softdepend:
  - packetevents
  - PlaceholderAPI

authors:
  - g4vrk

website: https://www.react-ac.space

permissions:
  react.command.usage:
    default: op
  react.bypass.aim-ai:
    default: false
  react.alerts:
    default: op
  react.admin:
    default: op

libraries:
  - org.spongepowered:configurate-yaml:4.2.0

  - org.xerial:sqlite-jdbc:3.42.0.0

  - org.incendo:cloud-paper:2.0.0
