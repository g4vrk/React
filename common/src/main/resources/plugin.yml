# noinspection YAMLSchemaValidation
name: ${name}
description: ${description}
version: ${version}

# noinspection PluginYml,YAMLSchemaValidation
main: ${mainClass}
api-version: '1.16'

folia-supported: true

softdepend:
  - packetevents
  - PlaceholderAPI

authors:
  - g4vrk

website: https://www.react-ac.space

permissions:
  react.command.usage:
    default: op
  react.bypass.aim-ai:
    default: false
  react.alerts:
    default: op
  react.admin:
    default: op

libraries:
  - com.squareup.moshi:moshi:1.15.0
  - com.squareup.moshi:moshi-adapters:1.15.0

  - org.spongepowered:configurate-yaml:4.2.0

  - org.ejml:ejml-core:0.41
  - org.ejml:ejml-ddense:0.41
  - org.ejml:ejml-simple:0.41

  - org.xerial:sqlite-jdbc:3.42.0.0

  - org.incendo:cloud-paper:2.0.0

