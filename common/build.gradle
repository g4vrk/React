plugins {
    id 'java-library'
}

repositories {
    maven {
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }

    maven {
        url = "https://repo.opencollab.dev/main/"
    }

    maven {
        url = "https://repo.opencollab.dev/snapshots/"
    }
}

def dependenciesDir = file("${rootProject.projectDir}/dependencies")

dependencies {

    compileOnly "io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT"

    compileOnly "me.clip:placeholderapi:2.11.6"
    compileOnly "com.github.retrooper:packetevents-spigot:2.13.0"

    compileOnly "com.squareup.moshi:moshi:1.15.0"
    compileOnly "com.squareup.moshi:moshi-adapters:1.15.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    compileOnly "org.ejml:ejml-core:0.41"
    compileOnly "org.ejml:ejml-ddense:0.41"
    compileOnly "org.ejml:ejml-simple:0.41"

    compileOnly "org.xerial:sqlite-jdbc:3.42.0.0"

    compileOnly "io.papermc:paperlib:1.0.8"

    compileOnly "org.spongepowered:configurate-yaml:4.2.0"

    compileOnly "org.incendo:cloud-paper:2.0.0"

    compileOnly "org.geysermc.geyser:api:2.9.0-SNAPSHOT"
    compileOnly "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"

    implementation fileTree(
            dir: dependenciesDir,
            include: [
                    'schedula-common-1.0.0.jar',
                    'FunctionalActions-2.0.0.jar',
                    'FastTextFormatter-1.0.0.jar',
                    'FunctionalConfiguration-1.0.0.jar'
            ]
    )

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}